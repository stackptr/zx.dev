name: CI

on:
  pull_request:
  push:
    branches: main

permissions:
  contents: read

jobs:
  # The check stackptr/ops's "Require CI" requires. No secrets: nothing here
  # pushes to a cache. The site reaches the Attic cache through rc, whose CI
  # builds spore (which serves it) and pushes that build from main.
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}
    - run: nix flake check
    - run: nix build
